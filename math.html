<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calculus Visualizer — ƒ, ƒ′, ƒ″</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.js"></script>
<script src="https://cdn.plot.ly/plotly-2.30.0.min.js" charset="utf-8"></script>

<style type="text/tailwindcss">
  .preset {
    @apply px-3 py-1.5 rounded-full text-xs font-medium bg-slate-800/70 hover:bg-slate-700
           border border-slate-700 text-slate-300 transition select-none;
  }
  .preset.active {
    @apply bg-sky-500/20 border-sky-500/50 text-sky-300;
  }
  .badge {
    @apply inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-semibold border;
  }
  .panel {
    @apply bg-slate-900/60 border border-slate-800 rounded-2xl;
  }
  .field-label {
    @apply block text-[10px] font-semibold uppercase tracking-widest text-slate-500 mb-1.5;
  }
  .num-input {
    @apply w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm font-mono text-slate-200
           outline-none focus:border-sky-500 transition;
  }
</style>

<style>
  html, body { -webkit-font-smoothing: antialiased; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; width: 100%; }
  input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 9999px; background: #1e293b; }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; margin-top: -5px;
    height: 16px; width: 16px; border-radius: 9999px;
    background: #38bdf8; border: 2px solid #020617;
    box-shadow: 0 0 0 2px rgba(56,189,248,.35);
  }
  input[type="range"]::-moz-range-track { height: 6px; border-radius: 9999px; background: #1e293b; }
  input[type="range"]::-moz-range-thumb {
    height: 16px; width: 16px; border: 2px solid #020617; border-radius: 9999px; background: #38bdf8;
  }

  #plot .modebar { background: transparent !important; }
  #plot .modebar-btn path { fill: #64748b !important; }
  #plot .modebar-btn:hover path { fill: #38bdf8 !important; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #020617; }
  ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
  ::-webkit-scrollbar-thumb:hover { background: #334155; }

  .toggle-chip {
    position: relative;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 13px 6px 11px;
    border-radius: 9999px;
    font-size: 11.5px; font-weight: 600; letter-spacing: .01em;
    background: rgba(30,41,59,0.55);
    border: 1px solid #334155;
    color: #94a3b8;
    cursor: pointer;
    user-select: none;
    transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
  }
  .toggle-chip:hover { border-color: #475569; background: rgba(30,41,59,0.85); }
  .toggle-chip input { position: absolute; opacity: 0; pointer-events: none; }
  .toggle-chip .dot {
    width: 9px; height: 9px; border-radius: 9999px;
    background: var(--c); opacity: 0.28;
    transition: opacity .15s, box-shadow .15s;
  }
  .toggle-chip input:checked ~ .dot { opacity: 1; box-shadow: 0 0 9px var(--c); }
  .toggle-chip input:checked ~ .lbl { color: #f1f5f9; }
  .toggle-chip:has(input:checked) {
    background: rgba(15,23,42,0.9);
    border-color: color-mix(in srgb, var(--c) 55%, #334155);
  }

  @media (min-width: 1024px) {
    .sidebar-sticky { position: sticky; top: 1.25rem; }
  }
</style>
</head>

<body class="bg-slate-950 text-slate-200 min-h-screen">
<div class="max-w-[1600px] mx-auto px-3 sm:px-6 py-5">

  <header class="flex flex-wrap items-end justify-between gap-4 mb-5">
    <div>
      <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight text-white">
        Calculus <span class="text-sky-400">Visualizer</span>
      </h1>
      <p class="text-sm text-slate-400 mt-1">
        Overlay ƒ(x), ƒ′(x) and ƒ″(x) on one graph — toggle curves and inspect any point live.
      </p>
    </div>
    <div id="expr-display"
         class="font-mono text-[11px] leading-relaxed text-slate-400 bg-slate-900/80 border border-slate-800 rounded-xl px-3 py-2"></div>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-[380px_minmax(0,1fr)] gap-5">

    <!-- ── LEFT: Controls ──────────────────────────────────── -->
    <aside class="lg:max-h-[calc(100vh-2.5rem)] lg:overflow-y-auto lg:pr-1">
      <div class="sidebar-sticky">
        <section class="panel p-4 sm:p-5 space-y-5">

          <div>
            <label for="fn-input" class="field-label">Function ƒ(x)</label>
            <div class="flex flex-col gap-2">
              <input id="fn-input" type="text" spellcheck="false" autocomplete="off" value="x^3 - 3*x"
                     class="w-full bg-slate-950 border border-slate-700 focus:border-sky-500 focus:ring-2 focus:ring-sky-500/30
                            rounded-xl px-3.5 py-2.5 font-mono text-sm text-sky-300 placeholder-slate-600 outline-none transition" />
              <button id="plot-btn"
                      class="w-full px-6 py-2.5 rounded-xl bg-sky-500 hover:bg-sky-400 active:bg-sky-600 text-slate-950
                             font-semibold text-sm transition shadow-lg shadow-sky-500/20">
                Plot
              </button>
            </div>
            <p id="error" class="hidden text-xs text-rose-400 mt-2 font-mono"></p>
          </div>

          <div>
            <span class="field-label">Presets</span>
            <div class="flex flex-wrap gap-2">
              <button class="preset" data-expr="x^3 - 3*x">Polynomial</button>
              <button class="preset" data-expr="3*sin(x)">Sine wave</button>
              <button class="preset" data-expr="exp(x/3)">Exponential</button>
              <button class="preset" data-expr="1/(x^2+1)">Bell curve</button>
              <button class="preset" data-expr="x^4 - 4*x^2 + x">Quartic</button>
              <button class="preset" data-expr="log(x^2+1)">Logarithmic</button>
            </div>
          </div>

          <div>
            <span class="field-label">Range</span>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label for="xmin" class="block text-[10px] text-slate-500 mb-1">x min</label>
                <input id="xmin" type="number" step="0.5" value="-5" class="num-input" />
              </div>
              <div>
                <label for="xmax" class="block text-[10px] text-slate-500 mb-1">x max</label>
                <input id="xmax" type="number" step="0.5" value="5" class="num-input" />
              </div>
            </div>
          </div>

          <div>
            <label class="flex items-center justify-between field-label mb-1.5">
              <span>Resolution</span>
              <span id="res-val" class="font-mono text-sky-400 normal-case tracking-normal">1200 pts</span>
            </label>
            <input id="res" type="range" min="200" max="8000" step="100" value="1200" />
          </div>

          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="field-label mb-0">Visible series</span>
              <div class="flex gap-1.5">
                <button id="all-on"  class="text-[10px] font-semibold uppercase tracking-wider text-slate-400 hover:text-sky-400 transition">All</button>
                <span class="text-slate-700">·</span>
                <button id="all-off" class="text-[10px] font-semibold uppercase tracking-wider text-slate-400 hover:text-sky-400 transition">None</button>
              </div>
            </div>
            <div class="flex flex-wrap gap-2">
              <label class="toggle-chip" style="--c:#4d9fff;">
                <input type="checkbox" class="series-toggle" data-group="f" checked>
                <span class="dot"></span><span class="lbl font-mono">ƒ(x)</span>
              </label>
              <label class="toggle-chip" style="--c:#ff5757;">
                <input type="checkbox" class="series-toggle" data-group="d1" checked>
                <span class="dot"></span><span class="lbl font-mono">ƒ′(x)</span>
              </label>
              <label class="toggle-chip" style="--c:#5fd45f;">
                <input type="checkbox" class="series-toggle" data-group="d2" checked>
                <span class="dot"></span><span class="lbl font-mono">ƒ″(x)</span>
              </label>
              <label class="toggle-chip" style="--c:#ffb84d;">
                <input type="checkbox" class="series-toggle" data-group="tangent" checked>
                <span class="dot"></span><span class="lbl">Tangent at c</span>
              </label>
              <label class="toggle-chip" style="--c:#b57fff;">
                <input type="checkbox" class="series-toggle" data-group="structural" checked>
                <span class="dot"></span><span class="lbl">Extrema &amp; Inflection</span>
              </label>
              <label class="toggle-chip" style="--c:#f1f5f9;">
                <input type="checkbox" class="series-toggle" data-group="points" checked>
                <span class="dot"></span><span class="lbl">Inspection point</span>
              </label>
            </div>
          </div>

          <div>
            <label class="flex items-center justify-between field-label mb-2">
              <span>Inspect point · x = c</span>
              <span id="c-val" class="font-mono text-amber-400 normal-case tracking-normal">1.000</span>
            </label>
            <input id="c-slider" type="range" min="-5" max="5" step="0.001" value="1" />
            <p class="text-[11px] text-slate-500 mt-1.5">
              Drag the slider — or click on the graph — to move the inspection point.
            </p>
          </div>

        </section>
      </div>
    </aside>

    <!-- ── RIGHT: Graph + Analysis ─────────────────────────── -->
    <main class="space-y-5 min-w-0">

      <section class="panel p-2 sm:p-3">
        <div id="plot" style="height:620px;"></div>
      </section>

      <section id="analysis" class="grid gap-4 md:grid-cols-3"></section>

    </main>
  </div>

  <footer class="text-center text-[11px] text-slate-600 mt-8 pb-2">
    Symbolic differentiation by Math.js · Rendering by Plotly.js
  </footer>
</div>

<script>
(() => {
  'use strict';

  /* ══════════════════════════════════════════════════════════
     Desmos-inspired palette (brightened for dark bg)
     ══════════════════════════════════════════════════════════ */
  const COL = {
    f:    '#4d9fff',   // Desmos blue
    d1:   '#ff5757',   // Desmos red
    d2:   '#5fd45f',   // Desmos green
    accent: '#ffb84d', // Desmos orange
    max:  '#ff5757',
    min:  '#5fd45f',
    infl: '#b57fff'    // Desmos purple
  };

  const B = {
    up:      'bg-emerald-500/10 text-emerald-300 border-emerald-500/30',
    down:    'bg-rose-500/10 text-rose-300 border-rose-500/30',
    flat:    'bg-amber-500/10 text-amber-300 border-amber-500/30',
    info:    'bg-sky-500/10 text-sky-300 border-sky-500/30',
    violet:  'bg-violet-500/10 text-violet-300 border-violet-500/30',
    neutral: 'bg-slate-700/30 text-slate-300 border-slate-600/40'
  };

  const EPS = 1e-7;

  const IX = {
    f: 0, d1: 1, d2: 2,
    tangent: 3,
    pF: 4, pD1: 5, pD2: 6,
    maxima: 7, minima: 8, infl: 9
  };

  const GROUPS = {
    f:          [IX.f],
    d1:         [IX.d1],
    d2:         [IX.d2],
    tangent:    [IX.tangent],
    points:     [IX.pF, IX.pD1, IX.pD2],
    structural: [IX.maxima, IX.minima, IX.infl]
  };

  const els = {
    fnInput:   document.getElementById('fn-input'),
    plotBtn:   document.getElementById('plot-btn'),
    error:     document.getElementById('error'),
    xmin:      document.getElementById('xmin'),
    xmax:      document.getElementById('xmax'),
    res:       document.getElementById('res'),
    resVal:    document.getElementById('res-val'),
    cSlider:   document.getElementById('c-slider'),
    cVal:      document.getElementById('c-val'),
    plot:      document.getElementById('plot'),
    analysis:  document.getElementById('analysis'),
    exprDisp:  document.getElementById('expr-display'),
    allOn:     document.getElementById('all-on'),
    allOff:    document.getElementById('all-off')
  };

  const S = {
    expr: 'x^3 - 3*x',
    xmin: -5, xmax: 5, n: 1200, c: 1,
    F: null, F1: null, F2: null, F3: null,
    str: { f: '', f1: '', f2: '', f3: '' },
    xs: [], y0: [], y1: [], y2: [],
    roots1: [], roots2: []
  };

  const CONFIG = {
    responsive: true,
    displaylogo: false,
    scrollZoom: true,
    modeBarButtonsToRemove: ['lasso2d', 'select2d', 'autoScale2d', 'toggleSpikelines']
  };

  let plotReady = false;
  let cRaf = null;

  /* ══════════════════════════════════════════════════════════
     Helpers
     ══════════════════════════════════════════════════════════ */
  const esc = s => String(s).replace(/[&<>"]/g,
    m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));

  function fmt(v, d = 4) {
    if (v === null || v === undefined || !isFinite(v)) return '—';
    if (v === 0) return '0';
    const a = Math.abs(v);
    if (a >= 1e5 || a < 1e-4) return v.toExponential(2);
    const s = v.toFixed(d);
    return s.replace(/\.?0+$/, '') || '0';
  }

  function ev(node, x) {
    if (!node) return NaN;
    try {
      const v = node.evaluate({ x });
      return (typeof v === 'number' && isFinite(v)) ? v : NaN;
    } catch (_) { return NaN; }
  }

  function showError(msg) { els.error.textContent = msg; els.error.classList.remove('hidden'); }
  function clearError()   { els.error.classList.add('hidden'); els.error.textContent = ''; }

  /* ══════════════════════════════════════════════════════════
     Symbolic engine
     ══════════════════════════════════════════════════════════ */
  function parseAndBuild() {
    const raw = els.fnInput.value.trim();
    if (!raw) { showError('Please enter a function of x.'); return false; }

    let node;
    try { node = math.parse(raw); }
    catch (e) { showError('Parse error: ' + e.message); return false; }

    let d1, d2, d3;
    try {
      d1 = math.derivative(node, 'x');
      d2 = math.derivative(d1, 'x');
      d3 = math.derivative(d2, 'x');
    } catch (e) {
      showError('Could not differentiate this expression: ' + e.message);
      return false;
    }

    try {
      S.F  = node.compile();
      S.F1 = d1.compile();
      S.F2 = d2.compile();
      S.F3 = d3.compile();
    } catch (e) {
      showError('Could not compile expression: ' + e.message);
      return false;
    }

    S.expr = raw;
    S.str = { f: node.toString(), f1: d1.toString(), f2: d2.toString(), f3: d3.toString() };
    clearError();
    return true;
  }

  /* ══════════════════════════════════════════════════════════
     Sampling — continuous & smooth
     ══════════════════════════════════════════════════════════
     Strategy for "continuous Desmos-like" curves:
      1. Very high uniform sampling density (default 1200 pts).
      2. Keep all finite values — no artificial capping.
      3. Only insert a break (null) where there is a genuine
         discontinuity, i.e. an enormous jump relative to the
         local scale.  This yields continuous smooth curves for
         well-behaved functions, and clean gaps at asymptotes.
  ══════════════════════════════════════════════════════════ */

  function smoothSeries(xs, ys) {
    const n = xs.length;

    // collect finite values to gauge central scale
    const finite = [];
    for (let i = 0; i < n; i++) if (isFinite(ys[i])) finite.push(ys[i]);
    if (finite.length < 4) return ys;

    const sorted = finite.slice().sort((a, b) => a - b);
    const p05 = sorted[Math.floor(sorted.length * 0.05)];
    const p95 = sorted[Math.floor(sorted.length * 0.95)];
    let spread = p95 - p05;
    if (!(spread > 0)) spread = Math.max(1, Math.abs(sorted[sorted.length - 1] - sorted[0]));

    // absolute jump threshold — anything bigger than this is a real discontinuity
    const JUMP = spread * 8;
    // also flag if slope between neighbours is astronomically larger than typical
    const slopeLimit = spread / Math.max(1e-9, (xs[1] - xs[0])) * 200;

    const out = new Array(n);
    for (let i = 0; i < n; i++) {
      const y = ys[i];
      if (!isFinite(y)) { out[i] = null; continue; }

      // check jump vs previous finite neighbour
      let broken = false;
      for (let j = i - 1; j >= 0; j--) {
        if (out[j] === null) break;
        if (!isFinite(ys[j])) break;
        const dy = Math.abs(y - ys[j]);
        const dx = Math.abs(xs[i] - xs[j]) || 1e-12;
        if (dy > JUMP || dy / dx > slopeLimit) { broken = true; }
        break; // only immediate neighbour
      }

      out[i] = broken ? null : y;
    }

    // Also null the immediately preceding point when a jump is detected
    // so the plot doesn't draw a near-vertical connecting segment.
    for (let i = 1; i < n; i++) {
      if (out[i] === null && out[i - 1] !== null && ys[i - 1] !== null) {
        // only null previous if the jump was genuine
        const dy = Math.abs(ys[i] - ys[i - 1]);
        if (dy > JUMP) out[i - 1] = null;
      }
    }

    return out;
  }

  function sample() {
    const n = Math.max(50, S.n | 0);
    const span = S.xmax - S.xmin;
    const step = span / (n - 1);

    const xs = new Array(n), y0 = new Array(n), y1 = new Array(n), y2 = new Array(n);

    for (let i = 0; i < n; i++) {
      const x = S.xmin + i * step;
      xs[i] = x;
      const a = ev(S.F,  x);
      const b = ev(S.F1, x);
      const c = ev(S.F2, x);
      y0[i] = isFinite(a) ? a : NaN;
      y1[i] = isFinite(b) ? b : NaN;
      y2[i] = isFinite(c) ? c : NaN;
    }

    S.xs = xs;
    S.y0 = smoothSeries(xs, y0);
    S.y1 = smoothSeries(xs, y1);
    S.y2 = smoothSeries(xs, y2);
  }

  /* ══════════════════════════════════════════════════════════
     Root finder
     ══════════════════════════════════════════════════════════ */
  function findRoots(fn) {
    const n = Math.min(5000, Math.max(1200, S.n));
    const xmin = S.xmin, xmax = S.xmax;
    if (!(xmax > xmin)) return [];

    const dx = (xmax - xmin) / (n - 1);
    const xs = new Array(n), ys = new Array(n);
    let maxAbs = 0;

    for (let i = 0; i < n; i++) {
      const x = xmin + i * dx;
      xs[i] = x;
      const y = ev(fn, x);
      ys[i] = isFinite(y) ? y : NaN;
      if (isFinite(y)) maxAbs = Math.max(maxAbs, Math.abs(y));
    }

    const roots = [];

    for (let i = 1; i < n; i++) {
      const a = ys[i - 1], b = ys[i];
      if (!isFinite(a) || !isFinite(b)) continue;
      if (a === 0) { roots.push(xs[i - 1]); continue; }
      if (a * b < 0) {
        let lo = xs[i - 1], hi = xs[i], flo = a;
        for (let k = 0; k < 60; k++) {
          const m = 0.5 * (lo + hi);
          const fm = ev(fn, m);
          if (!isFinite(fm)) break;
          if (flo * fm <= 0) { hi = m; } else { lo = m; flo = fm; }
        }
        roots.push(0.5 * (lo + hi));
      }
    }

    const tol = maxAbs > 0 ? maxAbs * 1e-4 : 1e-9;
    for (let i = 1; i < n - 1; i++) {
      const a = Math.abs(ys[i - 1]), b = Math.abs(ys[i]), c = Math.abs(ys[i + 1]);
      if (!isFinite(a) || !isFinite(b) || !isFinite(c)) continue;
      if (b < a && b <= c && b < tol) {
        let lo = xs[i - 1], hi = xs[i + 1];
        for (let k = 0; k < 80; k++) {
          const m1 = lo + (hi - lo) / 3;
          const m2 = hi - (hi - lo) / 3;
          if (Math.abs(ev(fn, m1)) < Math.abs(ev(fn, m2))) hi = m2; else lo = m1;
        }
        roots.push(0.5 * (lo + hi));
      }
    }

    roots.sort((p, q) => p - q);
    const dedupTol = (xmax - xmin) * 1e-4;
    const out = [];
    for (const r of roots) {
      if (!isFinite(r)) continue;
      if (!out.length || Math.abs(r - out[out.length - 1]) > dedupTol) out.push(r);
    }
    return out;
  }

  /* ══════════════════════════════════════════════════════════
     Desmos-style layout
     ══════════════════════════════════════════════════════════ */
  function mkAxis(title, color, spikes, showTicks) {
    const a = {
      color: '#94a3b8',
      tickfont: { size: 11, color: '#94a3b8', family: 'ui-sans-serif, system-ui' },
      gridcolor: 'rgba(148,163,184,0.14)',
      gridwidth: 1,
      zerolinecolor: 'rgba(203,213,225,0.55)',
      zerolinewidth: 1.6,
      linecolor: 'rgba(148,163,184,0.35)',
      linewidth: 1,
      showline: true,
      mirror: false,
      automargin: true,
      ticks: 'outside',
      tickcolor: 'rgba(148,163,184,0.35)',
      ticklen: 5
    };
    if (title) a.title = { text: title, font: { size: 12, color } };
    if (spikes) {
      a.showspikes = true;
      a.spikemode = 'across';
      a.spikesnap = 'cursor';
      a.spikecolor = 'rgba(148,163,184,0.5)';
      a.spikethickness = 1;
      a.spikedash = 'dot';
    }
    if (showTicks === false) a.showticklabels = false;
    return a;
  }

  function vlines(c) {
    return [{
      type: 'line',
      xref: 'x', x0: c, x1: c,
      yref: 'paper', y0: 0, y1: 1,
      line: { color: 'rgba(255,184,77,0.75)', width: 1.5, dash: 'dot' },
      layer: 'below'
    }];
  }

  function makeLayout(shapes) {
    return {
      showlegend: false,
      margin: { l: 56, r: 24, t: 18, b: 40 },
      paper_bgcolor: 'rgba(0,0,0,0)',
      plot_bgcolor: 'rgba(15,23,42,0.45)',
      font: { family: 'ui-sans-serif, system-ui, sans-serif', size: 11, color: '#cbd5e1' },
      hovermode: 'closest',
      hoverlabel: {
        bgcolor: '#0f172a',
        bordercolor: '#334155',
        font: { color: '#e2e8f0', size: 11, family: 'ui-monospace, monospace' }
      },
      dragmode: 'pan',
      xaxis:  mkAxis('x', '#94a3b8', true),
      yaxis:  mkAxis('y', '#94a3b8', false),
      shapes: shapes || []
    };
  }

  /* Desmos-style line config: smooth & continuous */
  const LINE_BASE = {
    shape: 'linear',   // high-res + linear = smooth & continuous (no spline overshoot)
    width: 2.6,
    simplify: false    // keep every sampled point — prevents Plotly from discarding detail
  };

  function buildTraces() {
    const c = S.c;
    const fc  = ev(S.F,  c);
    const d1c = ev(S.F1, c);
    const d2c = ev(S.F2, c);

    const half = (S.xmax - S.xmin) * 0.18 || 1;
    const tx = [c - half, c + half];
    const ty = tx.map(x => fc + d1c * (x - c));

    const maxima = [], minima = [];
    for (const r of S.roots1) {
      const y = ev(S.F, r);
      const k = ev(S.F2, r);
      if (!isFinite(y)) continue;
      if (k < -EPS) maxima.push({ x: r, y });
      else if (k > EPS) minima.push({ x: r, y });
    }

    const infl = [];
    for (const r of S.roots2) {
      const y = ev(S.F, r);
      if (isFinite(y)) infl.push({ x: r, y });
    }

    return [
      {
        x: S.xs, y: S.y0, type: 'scatter', mode: 'lines', name: 'ƒ(x)',
        line: Object.assign({}, LINE_BASE, { color: COL.f }),
        connectgaps: false,
        hovertemplate: 'ƒ(x)<br>x = %{x:.3f}<br>y = %{y:.3f}<extra></extra>'
      },
      {
        x: S.xs, y: S.y1, type: 'scatter', mode: 'lines', name: "ƒ′(x)",
        line: Object.assign({}, LINE_BASE, { color: COL.d1 }),
        connectgaps: false,
        hovertemplate: "ƒ′(x)<br>x = %{x:.3f}<br>y = %{y:.3f}<extra></extra>"
      },
      {
        x: S.xs, y: S.y2, type: 'scatter', mode: 'lines', name: "ƒ″(x)",
        line: Object.assign({}, LINE_BASE, { color: COL.d2 }),
        connectgaps: false,
        hovertemplate: "ƒ″(x)<br>x = %{x:.3f}<br>y = %{y:.3f}<extra></extra>"
      },
      {
        x: tx, y: ty, type: 'scatter', mode: 'lines', name: 'tangent',
        line: { color: COL.accent, width: 1.8, dash: 'dash' },
        hovertemplate: 'tangent<br>x = %{x:.3f}<br>y = %{y:.3f}<extra></extra>'
      },
      {
        x: [c], y: [fc], type: 'scatter', mode: 'markers', name: 'point ƒ',
        marker: { color: COL.f, size: 12, line: { color: '#020617', width: 2.5 } },
        hovertemplate: 'ƒ(c)<br>x = %{x:.4f}<br>y = %{y:.4f}<extra></extra>'
      },
      {
        x: [c], y: [d1c], type: 'scatter', mode: 'markers', name: "point ƒ′",
        marker: { color: COL.d1, size: 12, line: { color: '#020617', width: 2.5 } },
        hovertemplate: "ƒ′(c)<br>x = %{x:.4f}<br>y = %{y:.4f}<extra></extra>"
      },
      {
        x: [c], y: [d2c], type: 'scatter', mode: 'markers', name: "point ƒ″",
        marker: { color: COL.d2, size: 12, line: { color: '#020617', width: 2.5 } },
        hovertemplate: "ƒ″(c)<br>x = %{x:.4f}<br>y = %{y:.4f}<extra></extra>"
      },
      {
        x: maxima.map(p => p.x), y: maxima.map(p => p.y),
        type: 'scatter', mode: 'markers', name: 'local max',
        marker: { color: COL.max, size: 13, symbol: 'circle-open', line: { width: 3 } },
        hovertemplate: 'local max<br>x = %{x:.3f}<br>ƒ(x) = %{y:.3f}<extra></extra>'
      },
      {
        x: minima.map(p => p.x), y: minima.map(p => p.y),
        type: 'scatter', mode: 'markers', name: 'local min',
        marker: { color: COL.min, size: 13, symbol: 'circle-open', line: { width: 3 } },
        hovertemplate: 'local min<br>x = %{x:.3f}<br>ƒ(x) = %{y:.3f}<extra></extra>'
      },
      {
        x: infl.map(p => p.x), y: infl.map(p => p.y),
        type: 'scatter', mode: 'markers', name: 'inflection',
        marker: { color: COL.infl, size: 13, symbol: 'diamond-open', line: { width: 3 } },
        hovertemplate: 'inflection<br>x = %{x:.3f}<br>ƒ(x) = %{y:.3f}<extra></extra>'
      }
    ];
  }

  /* ══════════════════════════════════════════════════════════
     Visibility
     ══════════════════════════════════════════════════════════ */
  function getVisibilityMap() {
    const map = {};
    document.querySelectorAll('.series-toggle').forEach(cb => {
      map[cb.dataset.group] = cb.checked;
    });
    return map;
  }

  function applyVisibility() {
    if (!plotReady) return;
    const vis = getVisibilityMap();
    const update = { visible: [] };
    const idx = [];
    for (const group in GROUPS) {
      const on = !!vis[group];
      for (const i of GROUPS[group]) {
        idx.push(i);
        update.visible.push(on);
      }
    }
    Plotly.restyle(els.plot, { visible: update.visible }, idx);
  }

  /* ══════════════════════════════════════════════════════════
     Render
     ══════════════════════════════════════════════════════════ */
  async function fullRender() {
    if (!parseAndBuild()) return;

    readRange();
    syncSliderBounds();
    sample();

    S.roots1 = findRoots(S.F1);
    S.roots2 = findRoots(S.F2);

    updateExprDisplay();

    const data = buildTraces();
    const layout = makeLayout(vlines(S.c));

    if (!plotReady) {
      await Plotly.newPlot(els.plot, data, layout, CONFIG);
      plotReady = true;
      els.plot.on('plotly_click', onPlotClick);
    } else {
      await Plotly.react(els.plot, data, layout, CONFIG);
    }

    applyVisibility();
    updatePanel();
  }

  function updateC() {
    if (!plotReady) return;

    const c = S.c;
    const fc  = ev(S.F,  c);
    const d1c = ev(S.F1, c);
    const d2c = ev(S.F2, c);

    const half = (S.xmax - S.xmin) * 0.18 || 1;
    const tx = [c - half, c + half];
    const ty = tx.map(x => fc + d1c * (x - c));

    Plotly.update(
      els.plot,
      { x: [tx, [c], [c], [c]], y: [ty, [fc], [d1c], [d2c]] },
      { shapes: vlines(c) },
      [IX.tangent, IX.pF, IX.pD1, IX.pD2]
    );

    updatePanel();
  }

  function scheduleC() {
    if (cRaf) return;
    cRaf = requestAnimationFrame(() => { cRaf = null; updateC(); });
  }

  function updateExprDisplay() {
    els.exprDisp.innerHTML =
      `<div><span style="color:${COL.f}">ƒ(x)</span>&nbsp; = ${esc(S.str.f)}</div>` +
      `<div><span style="color:${COL.d1}">ƒ′(x)</span> = ${esc(S.str.f1)}</div>` +
      `<div><span style="color:${COL.d2}">ƒ″(x)</span> = ${esc(S.str.f2)}</div>`;
  }

  /* ══════════════════════════════════════════════════════════
     Analysis panel
     ══════════════════════════════════════════════════════════ */
  function statCard(o) {
    return `
      <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 space-y-3">
        <div class="flex items-center justify-between">
          <h3 class="font-mono text-sm font-bold" style="color:${o.color}">${o.title}</h3>
          <span class="text-[10px] uppercase tracking-widest text-slate-500">at x = c</span>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div class="bg-slate-950/70 border border-slate-800 rounded-xl px-3 py-2">
            <div class="text-[10px] uppercase tracking-widest text-slate-500">Value</div>
            <div class="font-mono text-lg text-white leading-tight">${o.value}</div>
          </div>
          <div class="bg-slate-950/70 border border-slate-800 rounded-xl px-3 py-2">
            <div class="text-[10px] uppercase tracking-widest text-slate-500">${o.slopeLabel}</div>
            <div class="font-mono text-lg text-white leading-tight">${o.slope}</div>
          </div>
        </div>
        <div class="flex flex-wrap gap-1.5">
          ${o.badges.map(b => `<span class="badge ${b.cls}">${b.text}</span>`).join('')}
        </div>
        <p class="text-[11px] text-slate-400 leading-relaxed font-mono">${o.note}</p>
      </div>`;
  }

  function updatePanel() {
    const c = S.c;
    const f  = ev(S.F,  c);
    const d1 = ev(S.F1, c);
    const d2 = ev(S.F2, c);
    const d3 = ev(S.F3, c);

    let fState, fConc;
    if (!isFinite(d1))   fState = { text: '· undefined', cls: B.neutral };
    else if (d1 > EPS)   fState = { text: '▲ Increasing', cls: B.up };
    else if (d1 < -EPS)  fState = { text: '▼ Decreasing', cls: B.down };
    else                 fState = { text: '● Stationary', cls: B.flat };

    if (!isFinite(d2))   fConc = { text: '· concavity n/a', cls: B.neutral };
    else if (d2 > EPS)   fConc = { text: '∪ Concave Up', cls: B.up };
    else if (d2 < -EPS)  fConc = { text: '∩ Concave Down', cls: B.down };
    else                 fConc = { text: '◆ Inflection Point', cls: B.violet };

    const noteF = (isFinite(f) && isFinite(d1))
      ? `Tangent: y = ${fmt(f)} ${d1 < 0 ? '−' : '+'} ${fmt(Math.abs(d1))}·(x − ${fmt(c)})`
      : 'Tangent line unavailable at this point.';

    let d1State, d1Conc;
    if (!isFinite(d2))   d1State = { text: '· undefined', cls: B.neutral };
    else if (d2 > EPS)   d1State = { text: '▲ Rate increasing', cls: B.up };
    else if (d2 < -EPS)  d1State = { text: '▼ Rate decreasing', cls: B.down };
    else                 d1State = { text: '● Rate stationary', cls: B.flat };

    if (!isFinite(d3))   d1Conc = { text: '· shape n/a', cls: B.neutral };
    else if (d3 > EPS)   d1Conc = { text: '∪ Concave Up', cls: B.up };
    else if (d3 < -EPS)  d1Conc = { text: '∩ Concave Down', cls: B.down };
    else                 d1Conc = { text: '— Linear region', cls: B.neutral };

    const noteD1 = isFinite(d1)
      ? `ƒ′ measures the slope of ƒ — it is ${d1 > EPS ? 'positive (rising)' : d1 < -EPS ? 'negative (falling)' : 'zero (flat)'} here.`
      : 'Derivative undefined at this point.';

    let d2Behav, d2Region;
    if (!isFinite(d3))   d2Behav = { text: '· undefined', cls: B.neutral };
    else if (d3 > EPS)   d2Behav = { text: '↗ Concavity increasing', cls: B.up };
    else if (d3 < -EPS)  d2Behav = { text: '↘ Concavity decreasing', cls: B.down };
    else                 d2Behav = { text: '→ Concavity constant', cls: B.flat };

    if (!isFinite(d2))   d2Region = { text: '· undefined', cls: B.neutral };
    else if (d2 > EPS)   d2Region = { text: '∪ ƒ is convex (up)', cls: B.info };
    else if (d2 < -EPS)  d2Region = { text: '∩ ƒ is concave (down)', cls: B.info };
    else                 d2Region = { text: '◆ Possible inflection', cls: B.violet };

    const noteD2 = isFinite(d2)
      ? `ƒ″ = ${fmt(d2)} → curvature is ${d2 > EPS ? 'positive (cup-shaped)' : d2 < -EPS ? 'negative (cap-shaped)' : 'zero'}.`
      : 'Second derivative undefined at this point.';

    els.analysis.innerHTML = [
      statCard({
        title: 'ƒ(x)', color: COL.f,
        value: fmt(f), slopeLabel: 'Slope ƒ′(c)', slope: fmt(d1),
        badges: [fState, fConc], note: noteF
      }),
      statCard({
        title: 'ƒ′(x)', color: COL.d1,
        value: fmt(d1), slopeLabel: 'Slope ƒ″(c)', slope: fmt(d2),
        badges: [d1State, d1Conc], note: noteD1
      }),
      statCard({
        title: 'ƒ″(x)', color: COL.d2,
        value: fmt(d2), slopeLabel: 'Slope ƒ‴(c)', slope: fmt(d3),
        badges: [d2Region, d2Behav], note: noteD2
      })
    ].join('');
  }

  /* ══════════════════════════════════════════════════════════
     Interaction
     ══════════════════════════════════════════════════════════ */
  function setC(v) {
    v = Math.min(S.xmax, Math.max(S.xmin, v));
    S.c = v;
    els.cSlider.value = v;
    els.cVal.textContent = v.toFixed(3);
    scheduleC();
  }

  function onPlotClick(e) {
    if (!e || !e.points || !e.points.length) return;
    const p = e.points[0];
    if (typeof p.x === 'number' && isFinite(p.x)) setC(p.x);
  }

  function readRange() {
    let a = parseFloat(els.xmin.value);
    let b = parseFloat(els.xmax.value);
    if (!isFinite(a)) a = -5;
    if (!isFinite(b)) b = 5;
    if (b <= a) b = a + 1;
    S.xmin = a;
    S.xmax = b;
    els.xmin.value = a;
    els.xmax.value = b;
  }

  function syncSliderBounds() {
    const s = els.cSlider;
    s.min = S.xmin;
    s.max = S.xmax;
    s.step = (S.xmax - S.xmin) / 2000;
    S.c = Math.min(S.xmax, Math.max(S.xmin, S.c));
    s.value = S.c;
    els.cVal.textContent = S.c.toFixed(3);
  }

  /* ── Wiring ─────────────────────────────────────────────── */
  els.plotBtn.addEventListener('click', fullRender);

  els.fnInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); fullRender(); }
  });

  document.querySelectorAll('.preset').forEach(btn => {
    btn.addEventListener('click', () => {
      els.fnInput.value = btn.dataset.expr;
      document.querySelectorAll('.preset').forEach(b => b.classList.toggle('active', b === btn));
      fullRender();
    });
  });

  els.xmin.addEventListener('change', fullRender);
  els.xmax.addEventListener('change', fullRender);

  els.res.addEventListener('input', () => {
    els.resVal.textContent = els.res.value + ' pts';
  });
  els.res.addEventListener('change', () => {
    S.n = parseInt(els.res.value, 10) || 1200;
    fullRender();
  });

  els.cSlider.addEventListener('input', () => {
    S.c = parseFloat(els.cSlider.value);
    els.cVal.textContent = S.c.toFixed(3);
    scheduleC();
  });

  document.querySelectorAll('.series-toggle').forEach(cb => {
    cb.addEventListener('change', applyVisibility);
  });

  els.allOn.addEventListener('click', () => {
    document.querySelectorAll('.series-toggle').forEach(cb => { cb.checked = true; });
    applyVisibility();
  });

  els.allOff.addEventListener('click', () => {
    document.querySelectorAll('.series-toggle').forEach(cb => { cb.checked = false; });
    applyVisibility();
  });

  /* ── Boot ───────────────────────────────────────────────── */
  (function boot() {
    document.querySelectorAll('.preset').forEach(b => {
      if (b.dataset.expr === els.fnInput.value.trim()) b.classList.add('active');
    });
    els.resVal.textContent = els.res.value + ' pts';
    S.n = parseInt(els.res.value, 10) || 1200;
    fullRender();
  })();

  let rRaf = null;
  window.addEventListener('resize', () => {
    if (rRaf) return;
    rRaf = requestAnimationFrame(() => {
      rRaf = null;
      if (plotReady) Plotly.Plots.resize(els.plot);
    });
  });

})();
</script>
</body>
</html>
