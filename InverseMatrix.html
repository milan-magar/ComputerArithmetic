<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inverse Matrix Method — Step-by-Step Solver</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    background: #eef2f9;
    color: #1e293b;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    line-height: 1.6;
  }

  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 40px 20px 100px;
  }

  header h1 {
    margin: 0 0 8px;
    font-size: 1.9rem;
    letter-spacing: -0.5px;
    color: #0f172a;
  }

  header p {
    margin: 0 0 32px;
    color: #64748b;
    font-size: 0.98rem;
  }

  .card {
    background: #fff;
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 24px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08),
                0 12px 32px -18px rgba(15, 23, 42, 0.25);
  }

  .card h2 {
    margin: 0 0 20px;
    font-size: 1.1rem;
    color: #0f172a;
    font-weight: 650;
  }

  .field {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }

  .field label {
    font-weight: 600;
    font-size: 0.95rem;
    color: #334155;
  }

  select {
    padding: 10px 14px;
    border: 1.5px solid #cbd5e1;
    border-radius: 9px;
    background: #fff;
    color: #1e293b;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
  }

  select:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px #dbeafe;
  }

  .eq-row {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .eq-row input {
    width: 72px;
    padding: 10px 8px;
    border: 1.5px solid #cbd5e1;
    border-radius: 9px;
    background: #fff;
    color: #0f172a;
    font-size: 1rem;
    font-family: inherit;
    text-align: center;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .eq-row input:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px #dbeafe;
  }

  .var {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: 1.2rem;
    color: #334155;
    min-width: 14px;
  }

  .op { color: #94a3b8; font-size: 1rem; margin: 0 2px; }

  .hint {
    font-size: 0.85rem;
    color: #94a3b8;
    margin: 6px 0 18px;
  }

  button.solve {
    padding: 12px 32px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 6px 18px -6px rgba(37, 99, 235, 0.6);
    transition: transform 0.12s, box-shadow 0.12s;
  }

  button.solve:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 24px -8px rgba(37, 99, 235, 0.7);
  }

  button.solve:active { transform: translateY(0); }

  .step {
    background: #fff;
    border-radius: 16px;
    padding: 22px 26px;
    margin-bottom: 20px;
    border-left: 4px solid #2563eb;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.07),
                0 10px 28px -18px rgba(15, 23, 42, 0.3);
  }

  .step.answer {
    border-left-color: #16a34a;
    background: linear-gradient(135deg, #f0fdf4, #dcfce7);
  }

  .step.error {
    border-left-color: #dc2626;
    background: #fef2f2;
  }

  .step-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .badge {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #2563eb;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 700;
  }

  .step.answer .badge { background: #16a34a; }
  .step.error .badge { background: #dc2626; }

  .step-head h2 {
    margin: 0;
    font-size: 1.02rem;
    color: #0f172a;
    font-weight: 650;
  }

  .step-body p {
    margin: 0 0 10px;
    font-size: 0.95rem;
    color: #475569;
  }

  /* ---------- matrix rendering ---------- */
  .mathline {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 14px 6px;
    font-size: 1rem;
    overflow-x: auto;
  }

  .matrix {
    display: inline-flex;
    align-items: stretch;
    vertical-align: middle;
    margin: 4px 6px;
  }

  .matrix .brk {
    width: 7px;
    border: 1.8px solid #1e293b;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .matrix .brk.l { border-right: none; border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .matrix .brk.r { border-left: none;  border-top-left-radius: 0;  border-bottom-left-radius: 0; }

  .matrix table {
    border-collapse: collapse;
    margin: 0 4px;
  }
  .matrix td {
    padding: 6px 11px;
    text-align: center;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1rem;
    line-height: 1.3;
    white-space: nowrap;
  }
  .matrix td.divider {
    border-left: 1.5px solid #64748b;
    padding-left: 15px;
  }

  /* ---------- fractions ---------- */
  .frac {
    display: inline-flex;
    align-items: center;
    vertical-align: middle;
    font-size: 0.92em;
    line-height: 1.05;
  }
  .frac .sign { padding-right: 2px; }
  .frac .stack { display: inline-block; text-align: center; vertical-align: middle; }
  .frac .num {
    display: block;
    border-bottom: 1.3px solid currentColor;
    padding: 0 4px;
  }
  .frac .den { display: block; padding: 0 4px; }

  /* ---------- equations ---------- */
  .eqs {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.05rem;
    line-height: 2;
    padding: 6px 4px;
    color: #0f172a;
  }
  .eqs .v { font-style: italic; }
  .eqs div { padding: 2px 0; }

  /* ---------- op label ---------- */
  .op-label {
    display: inline-block;
    margin: 14px 0 8px;
    padding: 6px 14px;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 8px;
    font-family: 'Segoe UI', sans-serif;
    font-size: 0.9rem;
    color: #1e40af;
    font-weight: 600;
  }

  .op-label + p { margin-top: 2px; }

  /* ---------- answer ---------- */
  .answer-line {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.35rem;
    color: #14532d;
    padding: 8px 4px;
    letter-spacing: 0.3px;
  }
  .answer-line .v { font-style: italic; }
  .answer-line .val { font-weight: 700; }
  .answer-line .sep { color: #64748b; margin: 0 8px; }

  .empty {
    text-align: center;
    color: #94a3b8;
    padding: 40px 20px;
    font-size: 0.95rem;
  }

  .mini { color: #64748b; font-size: 0.88rem; margin: 4px 0 0; }

  @media (max-width: 520px) {
    .wrap { padding: 24px 14px 60px; }
    .card, .step { padding: 18px; }
    .eq-row input { width: 60px; }
    .matrix td { padding: 5px 8px; font-size: 0.92rem; }
  }
</style>
</head>

<body>
<div class="wrap">
  <header>
    <h1>Inverse Matrix Method Solver</h1>
    <p>Solve a system of 2 or 3 linear equations using <em>X = A⁻¹B</em> — with every row operation shown.</p>
  </header>

  <div class="card">
    <h2>Enter the system</h2>

    <div class="field">
      <label for="nVars">Number of variables</label>
      <select id="nVars">
        <option value="2">2 variables &nbsp;(x, y)</option>
        <option value="3" selected>3 variables &nbsp;(x, y, z)</option>
      </select>
    </div>

    <div id="inputArea"></div>

    <p class="hint">
      You may enter integers (2), decimals (0.5) or simple fractions (1/2). Use a minus sign for negatives.
    </p>

    <button class="solve" id="solveBtn">Solve system</button>
  </div>

  <div id="output">
    <div class="card empty">The step-by-step solution will appear here.</div>
  </div>
</div>

<script>
/* ============================================================
   1. EXACT FRACTION ARITHMETIC
   ============================================================ */
function gcd(a, b) {
  a = Math.abs(a); b = Math.abs(b);
  while (b) { const t = b; b = a % b; a = t; }
  return a;
}

function Frac(n, d) {
  if (d === undefined) d = 1;
  if (d === 0) throw new Error('Division by zero');
  if (d < 0) { n = -n; d = -d; }
  const g = gcd(Math.abs(n), Math.abs(d)) || 1;
  this.n = n / g;
  this.d = d / g;
}
Frac.prototype.add = function (o) { return new Frac(this.n * o.d + o.n * this.d, this.d * o.d); };
Frac.prototype.sub = function (o) { return new Frac(this.n * o.d - o.n * this.d, this.d * o.d); };
Frac.prototype.mul = function (o) { return new Frac(this.n * o.n, this.d * o.d); };
Frac.prototype.div = function (o) { return new Frac(this.n * o.d, this.d * o.n); };
Frac.prototype.neg = function () { return new Frac(-this.n, this.d); };
Frac.prototype.isZero = function () { return this.n === 0; };
Frac.prototype.isNeg = function () { return this.n < 0; };
Frac.prototype.isOne = function () { return this.n === 1 && this.d === 1; };

function parseNum(s) {
  s = String(s).trim();
  if (s === '') return new Frac(0);
  if (s.indexOf('/') !== -1) {
    const p = s.split('/');
    const a = parseFloat(p[0]), b = parseFloat(p[1]);
    if (isNaN(a) || isNaN(b) || b === 0) throw new Error('bad');
    return new Frac(Math.round(a * 1e6), Math.round(b * 1e6));
  }
  if (s.indexOf('.') !== -1) {
    const dec = s.split('.')[1].length;
    const mult = Math.pow(10, dec);
    const v = parseFloat(s);
    if (isNaN(v)) throw new Error('bad');
    return new Frac(Math.round(v * mult), mult);
  }
  const v = parseInt(s, 10);
  if (isNaN(v)) throw new Error('bad');
  return new Frac(v);
}

/* ============================================================
   2. HTML RENDERERS (no external math library needed)
   ============================================================ */
const SUBS = { 1: '₁', 2: '₂', 3: '₃', 4: '₄', 5: '₅' };
function sub(n) { return SUBS[n] || String(n); }

function renderFrac(f) {
  if (f.d === 1) return String(f.n);
  const sign = f.n < 0 ? '\u2212' : '';
  const num = Math.abs(f.n);
  return '<span class="frac">' +
    (sign ? '<span class="sign">' + sign + '</span>' : '') +
    '<span class="stack">' +
      '<span class="num">' + num + '</span>' +
      '<span class="den">' + f.d + '</span>' +
    '</span>' +
  '</span>';
}

/* Render a matrix as HTML. dividerAfter = column index AFTER which to
   place a vertical bar (used for augmented matrices). */
function renderMatrix(M, dividerAfter) {
  let t = '<table>';
  for (let i = 0; i < M.length; i++) {
    t += '<tr>';
    for (let j = 0; j < M[i].length; j++) {
      const cls = (dividerAfter !== undefined && j === dividerAfter)
        ? ' class="divider"' : '';
      t += '<td' + cls + '>' + renderFrac(M[i][j]) + '</td>';
    }
    t += '</tr>';
  }
  t += '</table>';
  return '<span class="matrix">' +
    '<span class="brk l"></span>' + t + '<span class="brk r"></span>' +
  '</span>';
}

/* Render a column vector (list of fracs). */
function renderColumn(items) {
  return renderMatrix(items.map(function (x) { return [x]; }));
}

/* Render the equation system like:
      x + y + z = 7
      x + 2y + 3z = 16
      x + 3y + 4z = 22   */
function renderSystem(n, A, B) {
  const vars = ['x', 'y', 'z'];
  let html = '<div class="eqs">';
  for (let i = 0; i < n; i++) {
    let line = '';
    for (let j = 0; j < n; j++) {
      const c = A[i][j];
      if (c.isZero()) continue;

      const abs = new Frac(Math.abs(c.n), c.d);
      let coef;
      if (abs.isOne()) coef = '';                            // 1x → x
      else if (abs.d === 1) coef = String(abs.n);            // 2x, 3x
      else coef = renderFrac(abs);                           // (1/2)x

      const term = coef + '<span class="v">' + vars[j] + '</span>';

      if (line === '') {
        line = (c.isNeg() ? '\u2212' : '') + term;
      } else {
        line += (c.isNeg() ? ' \u2212 ' : ' + ') + term;
      }
    }
    if (line === '') line = '0';
    html += '<div>' + line + ' = ' + renderFrac(B[i]) + '</div>';
  }
  html += '</div>';
  return html;
}

/* ============================================================
   3. GAUSS–JORDAN — produces A⁻¹ and records every step
   ============================================================ */
function gaussJordan(n, A) {
  /* Build [A | I] */
  let M = A.map(function (row, i) {
    const idRow = [];
    for (let j = 0; j < n; j++) idRow.push(new Frac(i === j ? 1 : 0));
    return row.concat(idRow);
  });

  const steps = [];

  for (let col = 0; col < n; col++) {
    /* --- swap if pivot is zero --- */
    if (M[col][col].isZero()) {
      let sw = -1;
      for (let r = col + 1; r < n; r++) {
        if (!M[r][col].isZero()) { sw = r; break; }
      }
      if (sw === -1) return { singular: true, steps: steps };

      const tmp = M[col]; M[col] = M[sw]; M[sw] = tmp;
      steps.push({
        op: 'R' + sub(col + 1) + ' \u2194 R' + sub(sw + 1),
        desc: 'Interchange rows ' + (col + 1) + ' and ' + (sw + 1) +
              ' to bring a non-zero pivot into position (' + (col + 1) + ',' + (col + 1) + ').',
        mat: M.map(function (r) { return r.slice(); })
      });
    }

    /* --- scale pivot to 1 --- */
    const pivot = M[col][col];
    if (!pivot.isOne()) {
      for (let j = 0; j < 2 * n; j++) M[col][j] = M[col][j].div(pivot);
      const inv = new Frac(1).div(pivot);
      steps.push({
        op: 'R' + sub(col + 1) + ' \u2192 ' + renderFrac(inv) + ' \u00b7 R' + sub(col + 1),
        desc: 'Divide row ' + (col + 1) + ' by ' + renderFrac(pivot) +
              ' so the pivot becomes 1.',
        mat: M.map(function (r) { return r.slice(); })
      });
    }

    /* --- eliminate in every other row --- */
    for (let row = 0; row < n; row++) {
      if (row === col) continue;
      const f = M[row][col];
      if (f.isZero()) continue;

      for (let j = 0; j < 2 * n; j++) {
        M[row][j] = M[row][j].sub(f.mul(M[col][j]));
      }

      let opStr;
      if (f.isNeg()) {
        opStr = 'R' + sub(row + 1) + ' \u2192 R' + sub(row + 1) + ' + ' +
                renderFrac(f.neg()) + ' \u00b7 R' + sub(col + 1);
      } else {
        opStr = 'R' + sub(row + 1) + ' \u2192 R' + sub(row + 1) + ' \u2212 ' +
                renderFrac(f) + ' \u00b7 R' + sub(col + 1);
      }

      steps.push({
        op: opStr,
        desc: 'Use the pivot in row ' + (col + 1) +
              ' to make the entry in row ' + (row + 1) +
              ', column ' + (col + 1) + ' equal to zero.',
        mat: M.map(function (r) { return r.slice(); })
      });
    }
  }

  const inv = M.map(function (row) { return row.slice(n); });
  return { singular: false, inv: inv, steps: steps, final: M.map(function (r) { return r.slice(); }) };
}

/* ============================================================
   4. BUILD THE FULL STEP-BY-STEP HTML SOLUTION
   ============================================================ */
function buildSolution(n, A, B) {
  let stepNum = 0;
  function step(title, body, cls) {
    stepNum++;
    return '<section class="step ' + (cls || '') + '">' +
      '<div class="step-head"><span class="badge">' + stepNum + '</span>' +
      '<h2>' + title + '</h2></div>' +
      '<div class="step-body">' + body + '</div></section>';
  }

  const vars = ['x', 'y', 'z'].slice(0, n);
  let html = '';

  /* -------- Step 1: write AX = B -------- */
  let step1 = '<p>The given system of linear equations is:</p>' + renderSystem(n, A, B) +
              '<p>Writing it in the matrix form <em>AX = B</em>:</p>' +
              '<div class="mathline">' + renderMatrix(A) +
              renderColumn(vars.map(function () { return new Frac(0); }).map(function () { return null; }).length ? [] : []) +
              '</div>';
  /* rebuild the AX=B line properly */
  step1 = '<p>The given system of linear equations is:</p>' + renderSystem(n, A, B) +
          '<p>Writing it in the matrix form <em>AX = B</em>:</p>' +
          '<div class="mathline">' +
            renderMatrix(A) +
            renderColumn(vars.map(function (v) { return v; })).replace(/<td>([xyz])<\/td>/g, '<td><span class="v">$1</span></td>') +
            '<span style="font-size:1.2rem;">=</span>' +
            renderColumn(B) +
          '</div>' +
          '<p>where <em>A</em> is the coefficient matrix, <em>X</em> the variable ' +
          'matrix and <em>B</em> the constant matrix.</p>';
  html += step('Write the system in matrix form <em>AX = B</em>', step1);

  /* -------- Step 2: augmented matrix [A : I] -------- */
  const aug = A.map(function (row, i) {
    const idRow = [];
    for (let j = 0; j < n; j++) idRow.push(new Frac(i === j ? 1 : 0));
    return row.concat(idRow);
  });
  html += step('Form the augmented matrix [A : I]',
    '<p>To find the inverse <em>A</em><sup>\u22121</sup>, we set up the augmented matrix ' +
    '<em>[A : I]</em> and use row operations to reduce <em>A</em> to the identity ' +
    'matrix <em>I</em>. Whatever appears on the right will then be <em>A</em><sup>\u22121</sup>.</p>' +
    '<div class="mathline">[A : I] = ' + renderMatrix(aug, n) + '</div>');

  /* -------- Step 3: row reduction -------- */
  const res = gaussJordan(n, A);

  if (res.singular) {
    return html + '<section class="step error">' +
      '<div class="step-head"><span class="badge">!</span>' +
      '<h2>No unique solution</h2></div>' +
      '<div class="step-body"><p>During row reduction a pivot column contained all zeros. ' +
      'This means |A| = 0, so <em>A</em> is singular and <em>A</em><sup>\u22121</sup> ' +
      'does not exist. The system has either no solution or infinitely many solutions.</p>' +
      '</div></section>';
  }

  let gaussBody = '<p>Apply row operations to transform [A : I] into [I : A\u207B\u00B9].</p>';
  res.steps.forEach(function (s) {
    gaussBody += '<div class="op-label">' + s.op + '</div>';
    gaussBody += '<p>' + s.desc + '</p>';
    gaussBody += '<div class="mathline">' + renderMatrix(s.mat, n) + '</div>';
  });
  html += step('Reduce [A : I] to [I : A\u207B\u00B9] by row operations', gaussBody);

  /* -------- Step 4: extract A⁻¹ -------- */
  html += step('Read off the inverse matrix <em>A</em><sup>\u22121</sup>',
    '<p>The left half of the final augmented matrix is now the identity matrix, so the ' +
    'right half is the inverse of <em>A</em>:</p>' +
    '<div class="mathline"><em>A</em><sup>\u22121</sup> = ' + renderMatrix(res.inv) + '</div>');

  /* -------- Step 5: X = A⁻¹B -------- */
  const X = res.inv.map(function (row) {
    return row.reduce(function (s, x, k) { return s.add(x.mul(B[k])); }, new Frac(0));
  });

  html += step('Compute the solution <em>X = A</em><sup>\u22121</sup><em>B</em>',
    '<p>Multiply the inverse matrix by the constant matrix:</p>' +
    '<div class="mathline">' +
      '<em>X</em> = <em>A</em><sup>\u22121</sup><em>B</em> = ' +
      renderMatrix(res.inv) + renderColumn(B) + ' = ' + renderColumn(X) +
    '</div>');

  /* -------- Step 6: final answer -------- */
  const ansHtml = vars.map(function (v, i) {
    return '<span class="v">' + v + '</span> = <span class="val">' +
           renderFrac(X[i]) + '</span>';
  }).join('<span class="sep">,</span>');

  html += '<section class="step answer">' +
    '<div class="step-head"><span class="badge">\u2713</span>' +
    '<h2>Solution</h2></div>' +
    '<div class="step-body"><div class="answer-line">' + ansHtml + '</div></div></section>';

  /* -------- Step 7: verification -------- */
  const check = A.map(function (row) {
    return row.reduce(function (s, x, k) { return s.add(x.mul(X[k])); }, new Frac(0));
  });
  const ok = check.every(function (f, i) {
    return f.n === B[i].n && f.d === B[i].d;
  });

  html += step('Verification',
    '<p>Substituting the values back into <em>AX</em>:</p>' +
    '<div class="mathline">' +
      '<em>AX</em> = ' + renderMatrix(A) + renderColumn(X) + ' = ' + renderColumn(check) +
    '</div>' +
    '<p>' + (ok
      ? 'This equals <em>B</em>, so the solution is verified. \u2713'
      : 'Note: the numerical check did not match exactly.') + '</p>');

  return html;
}

/* ============================================================
   5. UI WIRING
   ============================================================ */
const DEFAULTS = {
  2: { A: [['2', '3'], ['4', '-1']], B: ['13', '5'] },
  3: { A: [['1', '1', '1'], ['1', '2', '3'], ['1', '3', '4']], B: ['7', '16', '22'] }
};

function generateInputs() {
  const n = parseInt(document.getElementById('nVars').value, 10);
  const vars = ['x', 'y', 'z'].slice(0, n);
  const d = DEFAULTS[n];
  let html = '';

  for (let i = 0; i < n; i++) {
    html += '<div class="eq-row">';
    for (let j = 0; j < n; j++) {
      html += '<input type="text" id="a' + i + j + '" value="' + d.A[i][j] + '" inputmode="text" />';
      html += '<span class="var">' + vars[j] + '</span>';
      if (j < n - 1) html += '<span class="op">+</span>';
    }
    html += '<span class="op">=</span>';
    html += '<input type="text" id="b' + i + '" value="' + d.B[i] + '" inputmode="text" />';
    html += '</div>';
  }

  document.getElementById('inputArea').innerHTML = html;
  document.getElementById('output').innerHTML =
    '<div class="card empty">The step-by-step solution will appear here.</div>';
}

function solveSystem() {
  const n = parseInt(document.getElementById('nVars').value, 10);
  const A = [], B = [];

  try {
    for (let i = 0; i < n; i++) {
      const row = [];
      for (let j = 0; j < n; j++) {
        row.push(parseNum(document.getElementById('a' + i + j).value));
      }
      A.push(row);
      B.push(parseNum(document.getElementById('b' + i).value));
    }
  } catch (e) {
    alert('Please enter valid numbers (integers, decimals like 0.5, or fractions like 1/2).');
    return;
  }

  const out = document.getElementById('output');
  try {
    out.innerHTML = buildSolution(n, A, B);
  } catch (err) {
    out.innerHTML = '<div class="card error"><strong>Error:</strong> ' + err.message + '</div>';
    console.error(err);
  }
  out.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.getElementById('nVars').addEventListener('change', generateInputs);
document.getElementById('solveBtn').addEventListener('click', solveSystem);
generateInputs();
</script>
